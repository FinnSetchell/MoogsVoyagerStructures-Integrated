plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${archives_base_name}-${project.name}-${minecraft_version}"
}

// `mod_version` / `maven_group` are NOT implicit Gradle properties the way a bare
// `version=` / `group=` would be — they have to be assigned explicitly or every
// jar builds as `…-unspecified.jar`.
version = "${mod_version}"
group = maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven { url "https://maven.neoforged.net/releases/" }
    maven { url "https://maven.fabricmc.net/" }
    exclusiveContent {
        forRepository {
            maven {
                name = 'CurseForge'
                url = 'https://cursemaven.com'
            }
        }
        filter { includeGroup 'curse.maven' }
    }
}

['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
            'Specification-Title'   : mod_name,
            'Specification-Vendor'  : 'FinnDog',
            'Specification-Version' : project.jar.archiveVersion,
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'FinnDog',
            'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
        'version'                    : version,
        'mod_name'                   : mod_name,
        'mc_version'                 : minecraft_version,
        'mod_id'                     : mod_id,
        'mod_description'            : mod_description,
        'mod_homepage'               : mod_homepage,
        'mod_sources'                : mod_sources,
        'mod_issues'                 : mod_issues,
        'mod_discord'                : mod_discord,
        'mod_kofi'                   : mod_kofi,
        'mod_curseforge'             : mod_curseforge,
        'mod_modrinth'               : mod_modrinth,
        'mod_releases'               : mod_releases,
        'structure_lib_version_range': structure_lib_version_range,
        'fabric_version'             : fabric_version,
        'fabric_loader_version'      : fabric_loader_version,
        'neoforge_loader_version_range': neoforge_loader_version_range,
        'forge_loader_version_range' : forge_loader_version_range,
        'minecraft_version_range'    : minecraft_version_range
    ]
    filesMatching(['fabric.mod.json', 'quilt.mod.json', 'META-INF/*.toml', 'pack.mcmeta', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        if (System.getenv('local_maven_url')) {
            maven {
                url System.getenv('local_maven_url')
            }
        }
    }
}
