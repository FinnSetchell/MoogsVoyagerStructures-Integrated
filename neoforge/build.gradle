plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
    id 'me.modmuss50.mod-publish-plugin'
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${modId}" {
            sourceSet sourceSets.main
        }
    }

    // Moog's Structure Lib (CurseForge project 1337167, version 1.21.1-3.0.0).
    // TODO Phase 2: set msl_neoforge_file in gradle.properties to the real CurseForge
    // file id for the MSL 1.21.1-3.0.0 NeoForge jar, then uncomment the line below.
    // runtimeOnly "curse.maven:moogs-structure-lib-1337167:${msl_neoforge_file}"
}

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogVersion = version.toString().replaceAll(/-alpha\.\d+$/, '')
def changelogMatcher = ~/(?s)## \[${changelogVersion}\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${modName} ${project.version}-${minecraftVersion} (NeoForge)"
    modLoaders.add("neoforge")
    dryRun = (project.findProperty('publishDryRun') ?: 'false').toString().toBoolean()
    maxRetries = 3

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_API_KEY')
        projectId = (project.findProperty('modrinthProjectId') ?: '')
        announcementTitle = "<:modrinth:1132291566019563550> NeoForge"
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = (project.findProperty('curseforgeProjectId') ?: '')
        projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '')
        announcementTitle = "<:curseforge:1132291568305459250> NeoForge"
        serverRequired = true
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }
}
