plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

dependencies {
    // Moog's Structure Lib (CurseForge project 1337167, version 1.21.1-3.0.0).
    // The common module uses Mojang-mapped neoForm, so the NeoForge jar (also
    // Mojang-mapped) is the correct artifact to compile the integration engine against.
    compileOnly "curse.maven:moogs-structure-lib-1337167:${msl_neoforge_file}"
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
