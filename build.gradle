plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.10-SNAPSHOT" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = "${rootProject.mod_version}"
    group = rootProject.maven_group

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'CurseForge'
                    url = 'https://cursemaven.com'
                }
            }
            filter { includeGroup 'curse.maven' }
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = rootProject.java_version as int
    }

    java {
        withSourcesJar()
    }
}

// Collect the per-loader release jars into the root build/libs so the v2 release workflow
// (which runs `./gradlew build`, then uploads build/libs/*.jar with if-no-files-found: error)
// finds them. Prefer remapJar (the real per-loader artifact) over the unremapped dev jar.
def loaderProjectsForCollect = subprojects.findAll { it.name in ['fabric', 'neoforge', 'forge'] && new File(it.projectDir, 'build.gradle').exists() }

tasks.register('collectJars', Copy) {
    loaderProjectsForCollect.each { sub ->
        def releaseTaskName = sub.tasks.findByName('remapJar') ? 'remapJar' : 'jar'
        dependsOn "${sub.path}:${releaseTaskName}"
        from(sub.tasks.named(releaseTaskName).flatMap { it.archiveFile })
    }
    into layout.buildDirectory.dir('libs')
}

if (tasks.findByName('build') == null) {
    tasks.register('build') {
        loaderProjectsForCollect.each { sub -> dependsOn "${sub.path}:build" }
        finalizedBy 'collectJars'
    }
} else {
    tasks.named('build').configure { finalizedBy 'collectJars' }
}
