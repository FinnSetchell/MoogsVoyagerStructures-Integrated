plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply false
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
}

// The release pipeline uploads the per-loader jars out of `{loader}/build/libs`,
// but the release workflow still requires the ROOT `build/libs` to be non-empty
// (`ls -la build/libs/` + an upload-artifact with if-no-files-found: error).
def loaderProjectsForCollect = subprojects.findAll { it.name in ['fabric', 'neoforge', 'forge'] && new File(it.projectDir, 'build.gradle').exists() }

tasks.register('collectJars', Copy) {
    loaderProjectsForCollect.each { sub ->
        // Loom subprojects (Fabric) expose an unremapped `jar` (classifier "dev")
        // that must NOT be distributed; the real release artifact is `remapJar`.
        // Prefer remapJar when present, else the plain jar (NeoForge/Forge).
        def releaseTaskName = sub.tasks.findByName('remapJar') ? 'remapJar' : 'jar'
        dependsOn "${sub.path}:${releaseTaskName}"
        from(sub.tasks.named(releaseTaskName).flatMap { it.archiveFile })
    }
    into layout.buildDirectory.dir('libs')
}

if (tasks.findByName('build') == null) {
    tasks.register('build') {
        loaderProjectsForCollect.each { sub -> dependsOn "${sub.path}:build" }
        finalizedBy 'collectJars'
    }
} else {
    tasks.named('build').configure { finalizedBy 'collectJars' }
}
