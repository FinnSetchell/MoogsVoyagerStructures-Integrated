plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
    id 'idea'
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    copyIdeResources = true

    reobf = false // Forge 1.20.6+ uses official mappings at runtime

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand([
            'version'                   : version,
            'mod_id'                    : mod_id,
            'mod_name'                  : mod_name,
            'mod_description'           : mod_description,
            'mod_homepage'              : mod_homepage,
            'structure_lib_version_range': structure_lib_version_range,
            'forge_loader_version_range': forge_loader_version_range
        ])
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Moog's Structure Lib (CurseForge project 1337167, version 1.21.1-3.0.0).
    implementation "curse.maven:moogs-structure-lib-1337167:${msl_forge_file}"

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}
