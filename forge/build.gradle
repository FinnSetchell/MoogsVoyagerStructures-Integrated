plugins {
    id 'multiloader-loader'
    id 'net.minecraftforge.gradle' version '[6.0.46,6.2)'
    id 'me.modmuss50.mod-publish-plugin'
    id 'idea'
}

base {
    archivesName = "${modId}-forge-${minecraftVersion}"
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

minecraft {
    mappings channel: 'official', version: minecraftVersion

    copyIdeResources = true

    reobf = false // Forge 1.20.6+ uses official mappings at runtime

    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformer = at
    }

    runs {
        client {
            workingDirectory file('runs/client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory file('runs/server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }
}

processResources {
    filesMatching('META-INF/mods.toml') {
        expand([
            'version'                   : version,
            'mod_id'                    : modId,
            'mod_name'                  : modName,
            'mod_description'           : modDescription,
            'mod_homepage'              : modHomepage,
            'structure_lib_version_range': structureLibVersionRange,
            'forge_loader_version_range': forge_loader_version_range
        ])
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${forge_version}"

    // Moog's Structure Lib (CurseForge project 1337167, version 1.21.1-3.0.0).
    implementation "curse.maven:moogs-structure-lib-1337167:${msl_forge_file}"

    // Forge's hack fix
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            fg.component(it)
        }
    }
}

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogVersion = version.toString().replaceAll(/-alpha\.\d+$/, '')
def changelogMatcher = ~/(?s)## \[${changelogVersion}\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${modName} ${project.version}-${minecraftVersion} (Forge)"
    modLoaders.add("forge")
    dryRun = (project.findProperty('publishDryRun') ?: 'false').toString().toBoolean()
    maxRetries = 3

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_API_KEY')
        projectId = (project.findProperty('modrinthProjectId') ?: '')
        announcementTitle = "<:modrinth:1132291566019563550> Forge"
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = (project.findProperty('curseforgeProjectId') ?: '')
        projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '')
        announcementTitle = "<:curseforge:1132291568305459250> Forge"
        serverRequired = true
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }
}
