org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=false

# Project identity
maven_group=com.finndog
mod_id=mvsintegrated
mod_name=MoogsVoyagerStructuresIntegrated
archives_base_name=MoogsVoyagerStructuresIntegrated
mod_version=2.0.0
java_version=17

# Common / multiloader stack (mirrors Moog's Structure Lib 1.20-1.20.4).
# Built against MC 1.20 for the widest 1.20-1.20.1 compatibility; metadata declares 1.20-1.20.1.
minecraft_version=1.20
minecraft_version_range=1.20-1.20.1
enabled_platforms=fabric,forge

# Fabric
fabric_loader_version=0.14.21
fabric_version=0.83.0+1.20

# Forge
forge_version=1.20-46.0.1
forge_loader_version_range=[46,)

# Moog's Structure Lib (MSL) CurseForge dependency. Project id 1337167 (1.20-1.20.4 v3.0.2).
# msl_fabric_file -> moogs_structures-1.20-1.20.4-3.0.2-fabric.jar
# msl_forge_file  -> moogs_structures-1.20-1.20.4-3.0.2-forge.jar
msl_fabric_file=8419670
msl_forge_file=8419671

# Mod metadata (expanded into fabric.mod.json / quilt.mod.json / *.mods.toml)
mod_description=86+ structures integrating Supplementaries & Amendments blocks into your world! A companion to Moogs Voyager Structures.
mod_homepage=https://github.com/finnsetchell/MoogsVoyagerStructures-Integrated
mod_sources=https://github.com/finnsetchell/MoogsVoyagerStructures-Integrated
mod_releases=https://github.com/finnsetchell/MoogsVoyagerStructures-Integrated/releases
mod_issues=https://github.com/finnsetchell/MoogsVoyagerStructures-Integrated/issues
mod_discord=https://discord.gg/S5nffJbuvA
mod_kofi=https://ko-fi.com/finndog
mod_curseforge=https://www.curseforge.com/minecraft/mc-mods/moogs-voyager-structures-integrated
mod_modrinth=https://modrinth.com/mod/moogs-voyager-structures-integrated

# Structure Lib dependency range (forge mods.toml)
structure_lib_version_range=[1.0.0,)
