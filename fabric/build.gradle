plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// Fleet artifact naming: {ModName}-{loader}-{mc}-{version}.jar — loader + MC live in archivesBaseName,
// remapJar carries no classifier, so the version field consumed by fabric.mod.json stays plain SemVer.
archivesBaseName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version}"

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_version}"

    // Moog's Structure Lib (runtime).
    modImplementation "curse.maven:moogs-structure-lib-1337167:${rootProject.msl_fabric_file}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

processResources {
    var expandProps = [
        'version'                    : project.version,
        'mod_id'                     : rootProject.mod_id,
        'mod_name'                   : rootProject.mod_name,
        'mc_version'                 : rootProject.minecraft_version,
        'mod_description'            : rootProject.mod_description,
        'mod_homepage'               : rootProject.mod_homepage,
        'mod_sources'                : rootProject.mod_sources,
        'mod_issues'                 : rootProject.mod_issues,
        'mod_discord'                : rootProject.mod_discord,
        'mod_kofi'                   : rootProject.mod_kofi,
        'mod_curseforge'             : rootProject.mod_curseforge,
        'mod_modrinth'               : rootProject.mod_modrinth,
        'mod_releases'               : rootProject.mod_releases,
        'structure_lib_version_range': rootProject.structure_lib_version_range,
        'forge_loader_version_range' : rootProject.forge_loader_version_range,
        'minecraft_version_range'    : rootProject.minecraft_version_range
    ]
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json']) {
        expand expandProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set("")
}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
