plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Moog's Structure Lib (CurseForge project 1337167, version 1.21.1-3.0.0).
    // TODO Phase 2: set msl_fabric_file in gradle.properties to the real CurseForge
    // file id for the MSL 1.21.1-3.0.0 Fabric jar, then uncomment the line below.
    // modImplementation "curse.maven:moogs-structure-lib-1337167:${msl_fabric_file}"
}

loom {
    def aw = project(':common').file("src/main/resources/${modId}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def changelogContent = rootProject.file('CHANGELOG.md').exists() ? rootProject.file('CHANGELOG.md').getText('UTF-8') : ''
def changelogVersion = version.toString().replaceAll(/-alpha\.\d+$/, '')
def changelogMatcher = ~/(?s)## \[${changelogVersion}\] - \d{4}-\d{2}-\d{2}\r?\n(.*?)(?=\r?\n---|\r?\n## \[|\z)/
def changelogMatch = (changelogContent =~ changelogMatcher)
def changelogLatest = changelogMatch.find() ? changelogMatch.group(1).trim() : ''

publishMods {
    file = tasks.named('remapJar').flatMap { it.archiveFile }
    changelog = changelogLatest
    version = project.version.toString()
    type = STABLE
    displayName = "${modName} ${project.version}-${minecraftVersion} (Fabric)"
    modLoaders.add("fabric")
    dryRun = (project.findProperty('publishDryRun') ?: 'false').toString().toBoolean()
    maxRetries = 3

    modrinth {
        accessToken = providers.environmentVariable('MODRINTH_API_KEY')
        projectId = (project.findProperty('modrinthProjectId') ?: '')
        announcementTitle = "<:modrinth:1132291566019563550> Fabric"
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }

    curseforge {
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        projectId = (project.findProperty('curseforgeProjectId') ?: '')
        projectSlug = (project.findProperty('curseforgeProjectSlug') ?: '')
        announcementTitle = "<:curseforge:1132291568305459250> Fabric"
        serverRequired = true
        minecraftVersionRange {
            start = project.findProperty('publishMcStart')
            end = project.findProperty('publishMcEnd')
        }
    }
}
